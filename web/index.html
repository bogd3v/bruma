<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bruma · your city's air quality</title>
    <meta name="description" content="Bruma: a city's air quality drawn with Rust, WebAssembly and WebGPU. Phase 0: the first triangle." />
    <meta name="color-scheme" content="dark" />

    <link data-trunk rel="rust" href="Cargo.toml" data-bin="bruma-web" data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue" />
    <link data-trunk rel="css" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="bruma-canvas" aria-label="Animated triangle drawn with the GPU: green, gold and blue on a dark background">
      </canvas>

      <header class="hud">
        <h1>Bruma</h1>
        <p>Phase 0 · the first triangle</p>
      </header>

      <p class="badge" aria-live="polite">GPU: <strong id="bruma-api">detecting…</strong></p>
      <p id="bruma-status" class="status" role="status">Loading WebAssembly…</p>

      <footer class="credits">
        Open source at
        <a href="https://github.com/bogd3v/bruma">github.com/bogd3v/bruma</a>
        · <a href="https://bogdev.com.co">BogDev</a>
      </footer>
    </main>

    <noscript>Bruma needs JavaScript and WebAssembly to draw with the GPU.</noscript>
  </body>
</html>
