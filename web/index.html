<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bruma · la calidad del aire de tu ciudad</title>
    <meta name="description" content="Bruma: la calidad del aire de una ciudad dibujada con Rust, WebAssembly y WebGPU. Fase 0: el primer triángulo." />
    <meta name="color-scheme" content="dark" />

    <link data-trunk rel="rust" href="Cargo.toml" data-bin="bruma-web" data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue" />
    <link data-trunk rel="css" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="bruma-canvas" aria-label="Triángulo animado dibujado con la GPU: verde, dorado y azul sobre fondo oscuro">
      </canvas>

      <header class="hud">
        <h1>Bruma</h1>
        <p>Fase 0 · el primer triángulo</p>
      </header>

      <p class="badge" aria-live="polite">GPU: <strong id="bruma-api">detectando…</strong></p>
      <p id="bruma-status" class="status" role="status">Cargando WebAssembly…</p>

      <footer class="credits">
        Código abierto en
        <a href="https://github.com/bogd3v/bruma">github.com/bogd3v/bruma</a>
        · <a href="https://bogdev.com.co">BogDev</a>
      </footer>
    </main>

    <noscript>Bruma necesita JavaScript y WebAssembly para dibujar con la GPU.</noscript>
  </body>
</html>
