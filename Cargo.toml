[workspace]
resolver = "3"
members = ["crates/bruma-data", "crates/bruma-render", "web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogd3v/bruma"
authors = ["BogDev <https://bogdev.com.co>"]

[workspace.dependencies]
bruma-data = { path = "crates/bruma-data" }
bruma-render = { path = "crates/bruma-render" }

# WebGPU as the main path and WebGL2 as the fallback, both through the same API.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Small Wasm binary: initial download matters more than a few milliseconds of CPU.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
