version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      cargo:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
