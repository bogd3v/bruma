name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  check:
    name: Formato, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Build web (Trunk → Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint para wasm32
        run: cargo clippy -p bruma-web -p bruma-render --target wasm32-unknown-unknown -- -D warnings
      - name: Instalar Trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version
      - name: Build de producción
        working-directory: web
        run: |
          set +e
          trunk build --release 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Muestra el final del log como anotación, visible en el resumen del PR.
            msg=$(tail -n 25 build.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=trunk build falló::$msg"
          fi
          exit "$status"
      - name: Tamaño del binario
        working-directory: web/dist
        run: |
          for f in *.wasm; do
            echo "$f: $(stat -c%s "$f") bytes · gzip: $(gzip -9 -c "$f" | wc -c) bytes"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bruma-web-dist
          path: web/dist
